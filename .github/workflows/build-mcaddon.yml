name: Build Minecraft Add-on

on:
  workflow_dispatch:
  push:
    branches:
      - commit-inicial

env:
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  MINECRAFT_PRODUCT: ${{ vars.MINECRAFT_PRODUCT }}
  CUSTOM_DEPLOYMENT_PATH: ""
jobs:
  build:
    name: Build .mcaddon
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: addon

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build add-on
        run: npm run build

      - name: Generate .mcaddon
        run: npm run mcaddon

      - name: Upload .mcaddon
        uses: actions/upload-artifact@v6
        with:
          name: animal-friendly-craft-addon
          path: addon/dist/packages/cpv_animal_friendly.mcaddon
          if-no-files-found: error